name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Step 1: prove every file arrived exactly as expected (names are case-sensitive here).
      - name: Verify project files
        run: |
          missing=0
          while read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              echo "::error::MISSING: $f"
              base=$(basename "$f")
              echo "   similar files found in the repo (check spelling, capitals, extension):"
              find . -path ./node_modules -prune -o -iname "${base%.*}*" -print | head -5
              missing=$((missing+1))
            fi
          done <<'LIST'
          components.json
          contracts/errors.ts
          contracts/registration.ts
          contracts/types.ts
          eslint.config.js
          index.html
          package.json
          postcss.config.js
          src/App.css
          src/App.tsx
          src/components/ActivityToast.tsx
          src/components/LanguageSwitcher.tsx
          src/components/Logo.tsx
          src/content/en.ts
          src/content/es.ts
          src/content/id.ts
          src/content/index.ts
          src/content/pl.ts
          src/content/pt.ts
          src/hooks/use-mobile.ts
          src/index.css
          src/lib/api.ts
          src/lib/i18n.tsx
          src/lib/motion.tsx
          src/lib/utils.ts
          src/main.tsx
          src/pages/Admin.tsx
          src/pages/AdminContent.tsx
          src/pages/Home.tsx
          src/pages/Register.tsx
          src/pages/Success.tsx
          src/providers/query.tsx
          src/sections/AccountControl.tsx
          src/sections/Earnings.tsx
          src/sections/FAQ.tsx
          src/sections/FinalCTA.tsx
          src/sections/Footer.tsx
          src/sections/HandlerSection.tsx
          src/sections/Hero.tsx
          src/sections/HowItWorks.tsx
          src/sections/Navbar.tsx
          src/sections/PrivacySection.tsx
          src/sections/Testimonials.tsx
          src/sections/TrustStrip.tsx
          src/sections/WhyAITraining.tsx
          tailwind.config.js
          tsconfig.app.json
          tsconfig.json
          tsconfig.node.json
          vite.config.ts
          LIST
          ui=$(ls src/components/ui 2>/dev/null | wc -l)
          echo "src/components/ui has $ui files (expected 53)"
          [ "$ui" -ge 53 ] || { echo "::error::src/components/ui is incomplete ($ui of 53)"; missing=$((missing+1)); }
          echo "---- src/sections as seen by the build ----"; ls -la src/sections || true
          if [ -d api ]; then echo "::warning::An old 'api' folder is still in the repo. It is no longer used and can be deleted."; fi
          if [ "$missing" -gt 0 ]; then echo "::error::$missing problem(s) found above. Fix those files, then push again."; exit 1; fi
          echo "All expected files are present."

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        env:
          # The Google Apps Script Web app URL (repo Settings -> Secrets and variables -> Actions -> Variables)
          VITE_SHEETS_URL: ${{ vars.VITE_SHEETS_URL }}
        run: |
          REPO="${{ github.event.repository.name }}"
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ] || [[ "$REPO" == *.github.io ]]; then
            export VITE_BASE="/"
          else
            export VITE_BASE="/$REPO/"
          fi
          echo "Building with base path: $VITE_BASE"
          if [ -z "$VITE_SHEETS_URL" ]; then echo "::warning::VITE_SHEETS_URL is not set, so the registration form will not save yet."; fi
          npm run build
          # Lets /register, /success and /admin work when the page is refreshed
          cp dist/public/index.html dist/public/404.html
          touch dist/public/.nojekyll
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then echo "${{ vars.CUSTOM_DOMAIN }}" > dist/public/CNAME; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
