name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Build
        env:
          # Your hosted backend, e.g. https://taskpilot-api.onrender.com  (repo Settings → Variables → Actions)
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          REPO="${{ github.event.repository.name }}"
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ] || [[ "$REPO" == *.github.io ]]; then
            export VITE_BASE="/"
          else
            export VITE_BASE="/$REPO/"
          fi
          npm run build
          # Single-page-app fallback so /register, /success and /admin work on refresh
          cp dist/public/index.html dist/public/404.html
          touch dist/public/.nojekyll
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then echo "${{ vars.CUSTOM_DOMAIN }}" > dist/public/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
